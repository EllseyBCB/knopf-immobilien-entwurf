<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Anfragen — Knopf Immobilien</title>
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anfragen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="symbol-192.png" type="image/png">
<link rel="apple-touch-icon" href="symbol-180.png">
<link rel="stylesheet" href="/schriften/schriften.css?v=d4e82f87">
<link rel="stylesheet" href="app.css?v=a7e70e49">
</head>
<body>

<!-- ══ Anmeldung ══ -->
<div class="tor" id="tor" hidden>
  <div class="tor__karte">
    <svg class="schluessel" viewBox="0 0 60 82" aria-hidden="true">
      <circle cx="30" cy="24" r="21"/>
      <circle cx="23" cy="17" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="37" cy="17" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="23" cy="31" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="37" cy="31" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M30 45 L30 78"/><path d="M30 62 L46 62"/>
      <path d="M46 62 L46 70"/><path d="M30 72 L42 72"/>
    </svg>
    <h1>Anfragen</h1>
    <p class="tor__unter">Knopf Immobilien — WEG-Verwaltung</p>

    <form id="anmelden">
      <label class="tor__feld">
        <span>E-Mail-Adresse</span>
        <input type="email" id="adresse" required autocomplete="username"
               placeholder="info@knopfimmobilien.de">
      </label>
      <label class="tor__feld">
        <span>Passwort</span>
        <input type="password" id="passwort" required autocomplete="current-password">
      </label>
      <button type="submit" class="tor__knopf" id="anmelde-knopf">Anmelden</button>
    </form>

    <p class="tor__meldung" id="tor-meldung" role="status"></p>

    <p class="tor__fuss">
      Einmal angemeldet, bleibt dieses Gerät angemeldet. Nur die hinterlegte
      Adresse sieht die Anfragen.
    </p>
  </div>
</div>

<!-- ══ Die Anfragen ══ -->
<header class="kopf" id="kopf" hidden>
  <div class="kopf__inhalt">
    <div class="kopf__schluessel">
      <svg class="schluessel schluessel--klein" viewBox="0 0 60 82" aria-hidden="true">
        <circle cx="30" cy="24" r="21"/>
        <circle cx="23" cy="17" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="37" cy="17" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="23" cy="31" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="37" cy="31" r="2.6" fill="currentColor" stroke="none"/>
        <path d="M30 45 L30 78"/><path d="M30 62 L46 62"/>
        <path d="M46 62 L46 70"/><path d="M30 72 L42 72"/>
      </svg>
      <div>
        <h1>Anfragen</h1>
        <p class="kopf__unter" id="wer">Knopf Immobilien</p>
      </div>
    </div>
    <div class="kopf__knoepfe">
      <button type="button" class="abmelden" id="passwort-oeffnen">Passwort ändern</button>
      <button type="button" class="abmelden" id="abmelden">Abmelden</button>
    </div>
  </div>
  <form class="neues-passwort" id="neues-passwort" hidden>
    <label class="tor__feld">
      <span>Neues Passwort (mindestens 8 Zeichen)</span>
      <input type="password" id="passwort-neu" required minlength="8" autocomplete="new-password">
    </label>
    <div class="staende">
      <button type="submit" class="klein" aria-pressed="true">Speichern</button>
      <button type="button" class="klein" id="passwort-abbrechen">Abbrechen</button>
    </div>
  </form>
</header>

<main class="rumpf" id="rumpf" hidden>
  <nav class="filter" id="filter" aria-label="Nach Stand filtern"></nav>
  <div class="liste" id="liste"></div>
</main>

<div class="stand-meldung" id="meldung" role="status" aria-live="polite"></div>

<script src="app.js?v=cd7bc219" defer></script>
</body>
</html>
