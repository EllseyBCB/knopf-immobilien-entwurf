# Veröffentlicht die ruhige Fassung auf GitHub Pages.
#
# Absicht: Es geht NUR das nach draussen, was zur Website gehört — plus die
# Anfragenverwaltung unter /verwaltung/. Die bewegte
# Fassung, die Vorschau der Anfragenverwaltung mit Beispieldaten und die Arbeitsdateien bleiben
# im Repository liegen, ohne unter der Kundenadresse erreichbar zu sein.
#
# Einmalige Voraussetzung im Repository:
#   Settings → Pages → Source = "GitHub Actions"

name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auslieferungsordner zusammenstellen
        run: |
          set -eu
          mkdir -p site
          # Seiten
          cp index.html impressum.html datenschutz.html 404.html site/
          # Gestaltung und Verhalten
          cp stil.css seite.js site/
          # Schriften und Bilder
          cp -r schriften bilder site/
          # Anfragenverwaltung als App für Jim (Daten nur nach Anmeldung)
          cp -r verwaltung site/
          # Suchmaschinen und Symbol
          cp robots.txt sitemap.xml favicon.ico site/
          # Eigene Domain: Die Datei CNAME im Projektordner ist der Schalter.
          # Liegt sie da, liefert GitHub unter der Domain aus. Sie darf erst
          # angelegt werden, wenn die DNS-Einträge stehen — vorher leitet
          # GitHub die Vorschauadresse auf die noch geparkte Domain um.
          # Anlegen nicht von Hand, sondern mit ./domain-aufschalten.sh.
          if [ -f CNAME ]; then
            cp CNAME site/
            echo "Eigene Domain aktiv: $(cat CNAME)"
          else
            echo "Keine eigene Domain gesetzt — Auslieferung unter github.io"
          fi
          # GitHub soll den Ordner unverändert ausliefern
          touch site/.nojekyll

      - name: Gegenprobe — nichts Unbeabsichtigtes dabei
        run: |
          set -eu
          for verboten in bewegt.html bewegt.css bewegt.js anfragen.html \
                          entwurf.css stempeln.py README.md BILDNACHWEIS.md; do
            if [ -e "site/$verboten" ]; then
              echo "FEHLER: $verboten würde veröffentlicht werden."
              exit 1
            fi
          done
          # Keine echte Ladeanweisung mehr zu Google Fonts. Gesucht wird
          # nach href/src/url() — nicht nach der blossen Zeichenkette, sonst
          # schlägt die Prüfung auch bei einem Kommentar an, der die
          # Herkunft der Schriftdateien dokumentiert.
          if grep -rEq '(href|src)=["'"'"']?https?://fonts\.(googleapis|gstatic)\.com|url\(["'"'"']?https?://fonts\.(googleapis|gstatic)\.com' site/; then
            echo "FEHLER: Es wird noch eine Schriftart von Google geladen:"
            grep -rEn '(href|src)=["'"'"']?https?://fonts\.(googleapis|gstatic)\.com|url\(["'"'"']?https?://fonts\.(googleapis|gstatic)\.com' site/
            exit 1
          fi
          echo "Auslieferungsordner geprüft:"
          find site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
